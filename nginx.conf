server {
    listen       8080;
    server_name  localhost;

    # Enable gzip compression for faster content delivery
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 1000;

    # Set proper root directive for the entire server block
    root   /usr/share/nginx/html;

    # COOP/COEP only where ffmpeg.wasm runs (upload page) — not video playback
    location = /index.html {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
    }

    # Short cache for code — long cache for images (Cloudflare respects these)
    location ~* \.(js|css|html)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate, no-transform";
        try_files $uri =404;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Main location block
    location / {
        index  index.html;
        try_files $uri $uri/ /index.html;
    }

    # Handle API requests by proxying to backend
    location /api/ {
        # This block is commented out because the backend configuration 
        # will be handled by Kubernetes networking
        # Uncomment and adjust if you need direct proxying in certain environments
        # proxy_pass http://replay-hub:8080/;
        # proxy_set_header Host $host;
        # proxy_set_header X-Real-IP $remote_addr;
    }

    # Handle errors
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
